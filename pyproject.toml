[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-claude"
version = "0.1.0"
description = "Personal Claude-grade system — state + memory + perf + gateway/action bridge."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jae Won Lee" }]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
bridge = [
    "pyyaml>=6.0",
]
gstar = [
    "duckdb>=1.0",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "typer>=0.12",
    "python-ulid>=3.0",
    "cryptography>=42.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "networkx>=3.0",
]
ctx = [
    "typer>=0.12",
    "python-ulid>=3.0",
]
fetch = [
    "playwright>=1.58",
    "beautifulsoup4>=4.12",
]
entity = [
    "kiwipiepy>=0.17",
]
input = [
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pyhwp>=0.1b15",
    "python-pptx>=1.0",
    "beautifulsoup4>=4.12",
]

[project.scripts]
lcai = "local_claude.cli:main"
g = "gstar.cli.main:app"
ctx = "ctx.cli:app"
fetch-share = "local_claude.tools.share_fetcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_claude", "src/gstar", "src/ctx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
