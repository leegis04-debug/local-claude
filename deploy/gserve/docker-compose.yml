# 미니 PC(100.79.251.53) 에서:
#   cd /opt/gstar/local-claude
#   docker compose -f deploy/gserve/docker-compose.yml up -d
#
# 볼륨 경로는 DSM/Synology 이 아니라 미니 PC 의 로컬 경로. DS218 은 별도 Hyper Backup.

services:
  g-serve:
    build:
      context: ../..
      dockerfile: deploy/gserve/Dockerfile
    image: gstar-serve:latest
    container_name: g-serve
    restart: unless-stopped
    # host network 사용 이유: NordVPN/Meshnet + Docker iptables 충돌 회피.
    # 호스트의 9999 에 직접 바인딩 → ufw "Anywhere on nordlynx ALLOW" 룰이 바로 적용.
    network_mode: host
    volumes:
      - ${GSTAR_DATA_DIR:-./gstar-data}:/app/state
      # NAS 원문 저장소 — Phase A1 (읽기 전용). 컨테이너 내부에서 /nas/workspace 경로로 접근.
      # 호스트에 /mnt/nas/workspace 가 autofs CIFS 로 마운트되어야 함 (GSTAR_NAS_SRC 로 override 가능).
      - ${GSTAR_NAS_SRC:-/mnt/nas/workspace}:/nas/workspace:ro
      # Sprint B — wiki 파생 뷰 전용 rw 볼륨. 원문 ro 와 완전 분리.
      - ${GSTAR_WIKI_SRC:-/mnt/nas/workspace/wiki}:/nas/wiki:rw
    environment:
      GSTAR_HOME: /app/state
      GSTAR_NAS_ROOT: /nas/workspace
      GSTAR_WIKI_OUT: /nas/wiki
      # Sprint B — emit 끝에 Gitea 로 자동 push (remote URL 은 /nas/wiki/.git/config
      # 에 token 포함해서 저장. 초기 push 는 수동 1회).
      GSTAR_WIKI_GIT_PUSH: ${GSTAR_WIKI_GIT_PUSH:-on}
      TZ: Asia/Seoul
      # Phase D: /search/fused + /notes(mirror) 가 기존 Gateway 로 호출할 때 사용
      GATEWAY_URL: ${GATEWAY_URL:-http://100.79.251.53:8000}
      ASST_TOKEN: ${ASST_TOKEN:-}
      GP_MIRROR_QDRANT: ${GP_MIRROR_QDRANT:-off}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9999/health"]
      interval: 30s
      timeout: 5s
      retries: 3
