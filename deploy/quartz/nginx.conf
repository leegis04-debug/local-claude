server {
    listen 8080 default_server;
    listen [::]:8080 default_server;

    root /usr/share/nginx/html;
    index index.html;

    # Quartz 정적 사이트 — 한 번 찾고 못 찾으면 index.html 폴백 (SPA-like 안전망)
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # 캐시 — wiki 내용은 15분마다 바뀌므로 공격적 캐싱 지양
    location ~* \.(?:css|js|woff2?|ttf|svg|png|jpg|jpeg|gif)$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }
    location ~* \.html$ {
        expires 1m;
        add_header Cache-Control "public, max-age=60";
    }

    # gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    access_log /var/log/nginx/quartz.access.log;
    error_log  /var/log/nginx/quartz.error.log warn;
}
