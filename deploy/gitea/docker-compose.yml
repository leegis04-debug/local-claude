# Sprint B — wiki git 백업 + 모바일 read 용 Gitea.
# 플랜 v4 §5 Remote Vault 인프라.
#
# 미니 PC(100.79.251.53) 에서:
#   cd /home/ljw-op/local-claude/deploy/gitea
#   docker compose up -d
#
# HTTP: http://100.79.251.53:3001  (Meshnet direct, 외부망은 SSH 터널)
# SSH clone: 생략 (HTTP clone 으로 충분)

services:
  gitea:
    image: gitea/gitea:1.22
    container_name: gitea
    restart: unless-stopped
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__server__ROOT_URL: http://100.79.251.53:3001/
      GITEA__server__HTTP_PORT: 3000
      GITEA__server__DOMAIN: 100.79.251.53
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__security__INSTALL_LOCK: "true"
      TZ: Asia/Seoul
    volumes:
      - ${GITEA_DATA_DIR:-/home/ljw-op/gitea-data}:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/v1/version"]
      interval: 60s
      timeout: 5s
      retries: 3
