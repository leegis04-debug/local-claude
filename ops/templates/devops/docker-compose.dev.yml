services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./src:/workspace/src
    environment:
      - ENV=development
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # 필요 시 추가: db, redis, etc.
