global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Spring Boot Actuator (micrometer-prometheus 노출)
  - job_name: spring-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['spring-backend:8080']

  # Python AI Worker (prometheus-client /metrics)
  - job_name: ai-worker
    static_configs:
      - targets: ['ai-worker:8001']

  # Postgres exporter (선택, 활성화 시 추가)
  # - job_name: postgres
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
