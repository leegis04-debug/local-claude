spring:
  application:
    name: __PROJECT__
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app}
    username: ${SPRING_DATASOURCE_USERNAME:dev}
    password: ${SPRING_DATASOURCE_PASSWORD:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  ai:
    model:
      chat: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.2}
          temperature: 0.4
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        dimensions: 768

ai-worker:
  url: ${AI_WORKER_URL:http://localhost:8001}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
