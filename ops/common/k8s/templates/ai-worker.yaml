{{- if .Values.aiWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}-ai-worker
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-worker
spec:
  replicas: {{ .Values.aiWorker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "app.fullname" . }}
      app.kubernetes.io/component: ai-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "app.fullname" . }}
        app.kubernetes.io/component: ai-worker
    spec:
      containers:
        - name: ai-worker
          image: "{{ .Values.aiWorker.image.repository }}:{{ .Values.aiWorker.image.tag }}"
          imagePullPolicy: {{ .Values.aiWorker.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.aiWorker.port }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.aiWorker.port }}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.aiWorker.port }}
            initialDelaySeconds: 30
          resources:
            {{- toYaml .Values.aiWorker.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.fullname" . }}-ai-worker
spec:
  selector:
    app.kubernetes.io/name: {{ include "app.fullname" . }}
    app.kubernetes.io/component: ai-worker
  ports:
    - port: {{ .Values.aiWorker.port }}
      targetPort: {{ .Values.aiWorker.port }}
{{- end }}
